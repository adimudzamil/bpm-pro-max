<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Border Diagnostic</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background:#f8fafc; color:#1e293b; margin:0; padding:16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  label.btn { display:inline-block; background:#2563eb; color:#fff; padding:12px 20px; border-radius:50px; font-weight:700; cursor:pointer; }
  input[type=file] { display:none; }
  .summary { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:12px; margin:12px 0; font-family:monospace; font-size:13px; }
  .summary b { color:#2563eb; }
  .verdict { padding:12px; border-radius:12px; margin:12px 0; font-weight:600; }
  .verdict.ok { background:#dcfce7; color:#166534; }
  .verdict.bad { background:#fee2e2; color:#991b1b; }
  .verdict.mid { background:#fef3c7; color:#92400e; }
  canvas { max-width:100%; height:auto; border:1px solid #cbd5e1; border-radius:8px; display:block; margin-top:8px; }
  #wrap { overflow:auto; }
  .items { font-family:monospace; font-size:11px; background:#1e293b; color:#e2e8f0; padding:8px; border-radius:8px; max-height:200px; overflow:auto; white-space:pre; margin-top:12px; }
</style>
</head>
<body>
<h1>🔎 PDF Border Diagnostic</h1>
<label class="btn" for="f">📎 Choose PDF</label>
<input type="file" id="f" accept=".pdf">
<div id="status" style="margin-top:12px; font-family:monospace; font-size:13px;"></div>
<div id="verdict"></div>
<div class="summary" id="summary" style="display:none;"></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div class="items" id="items" style="display:none;"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

document.getElementById('f').addEventListener('change', async (e) => {
  const file = e.target.files[0]; if (!file) return;
  const status = document.getElementById('status');
  const verdict = document.getElementById('verdict');
  const summary = document.getElementById('summary');
  const itemsEl = document.getElementById('items');
  status.textContent = 'Reading…';
  verdict.className = ''; verdict.textContent = '';
  summary.style.display = 'none'; itemsEl.style.display = 'none';

  try {
    const ab = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: ab}).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({scale: 1.5});

    const cv = document.getElementById('cv');
    cv.width = viewport.width;
    cv.height = viewport.height;
    const ctx = cv.getContext('2d');

    await page.render({canvasContext: ctx, viewport}).promise;

    const ops = await page.getOperatorList();
    const lines = [];
    let pathOpCount = 0, rectCount = 0;

    for (let i = 0; i < ops.fnArray.length; i++) {
      const fn = ops.fnArray[i];
      const args = ops.argsArray[i];

      if (fn === pdfjsLib.OPS.constructPath) {
        pathOpCount++;
        const subOps = args[0], subArgs = args[1];
        let cur = null;
        for (let j = 0; j < subOps.length; j++) {
          const op = subOps[j], a = subArgs[j];
          if (op === pdfjsLib.OPS.moveTo) cur = a;
          else if (op === pdfjsLib.OPS.lineTo && cur) {
            lines.push([cur[0], cur[1], a[0], a[1]]);
            cur = a;
          } else if (op === pdfjsLib.OPS.curveTo && a) {
            cur = [a[4], a[5]];
          }
        }
      } else if (fn === pdfjsLib.OPS.rectangle) {
        rectCount++;
        const [x, y, w, h] = args;
        lines.push([x, y, x+w, y], [x+w, y, x+w, y+h],
                   [x+w, y+h, x, y+h], [x, y+h, x, y]);
      }
    }

    // Draw overlay
    ctx.strokeStyle = 'rgba(255,0,0,0.65)';
    ctx.lineWidth = 1;
    let horiz = 0, vert = 0;
    for (const [x1,y1,x2,y2] of lines) {
      const [vx1, vy1] = viewport.convertToViewportPoint(x1, y1);
      const [vx2, vy2] = viewport.convertToViewportPoint(x2, y2);
      ctx.beginPath(); ctx.moveTo(vx1, vy1); ctx.lineTo(vx2, vy2); ctx.stroke();
      if (Math.abs(y2 - y1) < 0.5) horiz++;
      else if (Math.abs(x2 - x1) < 0.5) vert++;
    }

    // Text items preview
    const tc = await page.getTextContent();
    const preview = tc.items.slice(0, 40).map(it =>
      `x=${it.transform[4].toFixed(1)} y=${it.transform[5].toFixed(1)}  ${JSON.stringify(it.str)}`
    ).join('\n');
    itemsEl.textContent = preview;
    itemsEl.style.display = 'block';

    summary.style.display = 'block';
    summary.innerHTML =
      `Path ops: <b>${pathOpCount}</b><br>` +
      `Rectangles: <b>${rectCount}</b><br>` +
      `Line segments extracted: <b>${lines.length}</b><br>` +
      `  ↳ horizontal: <b>${horiz}</b>, vertical: <b>${vert}</b>`;

    if (horiz >= 5 && vert >= 5) {
      verdict.className = 'verdict ok';
      verdict.textContent = '✅ Table borders found as drawing ops. Path A will work.';
    } else if (lines.length > 0) {
      verdict.className = 'verdict mid';
      verdict.textContent = '⚠️ Some drawing ops found, but not clearly a table grid. Send me the numbers.';
    } else {
      verdict.className = 'verdict bad';
      verdict.textContent = '❌ No line drawing ops. PDF has no visible borders — we fall back to heuristics (Path B).';
    }

    status.textContent = `Page 1 of ${pdf.numPages} rendered.`;
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    console.error(err);
  }
});
</script>
</body>
</html>
