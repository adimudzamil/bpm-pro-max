<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, minimum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0f0a">
  <title>⌨️ MATRIX TERMINAL</title>
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIk1hdHJpeCBUZXJtaW5hbCIsCiAgInNob3J0X25hbWUiOiAiVGVybWluYWwiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzBhMGYwYSIsCiAgInRoZW1lX2NvbG9yIjogIiMwYTBmMGEiLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJkYXRhOmltYWdlL3N2Zyt4bWwsJTNDc3ZnIHhtbG5zPSdodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2Zycgdmlld0JveD0nMCAwIDUxMiA1MTInJTNFJTNDcmVjdCB3aWR0aD0nNTEyJyBoZWlnaHQ9JzUxMicgcng9JzUwJyBmaWxsPSclMjMwYTBmMGEnLyUzRSUzQ3RleHQgeD0nMjU2JyB5PSczMjAnIGZvbnQtc2l6ZT0nMjAwJyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmaWxsPSclMjMwMGZmNDEnIGZvbnQtZmFtaWx5PSdtb25vc3BhY2UnJTNFJTIzJTNDL3RleHQlM0UlM0Mvc3ZnJTNFIiwKICAgICAgInNpemVzIjogIjUxMng1MTIiLAogICAgICAidHlwZSI6ICJpbWFnZS9zdmcreG1sIgogICAgfQogIF0KfQ==">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Courier New', Courier, 'Fira Code', monospace;
    }

    html, body {
      background: #0a0f0a;
      color: #00ff41;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: none;
      touch-action: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: #0a0f0a;
      padding: 6px 6px 4px 6px;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      touch-action: none;
    }

    /* ----- SCREEN (top) - now smaller to fit keyboard ----- */
    #screen-container {
      flex: 0 0 auto;
      height: 30%;
      min-height: 80px;
      max-height: 35%;
      background: #0f140f;
      border: 1px solid #1f3f1f;
      border-radius: 14px 14px 8px 8px;
      box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.08), 0 0 12px rgba(0, 255, 65, 0.15);
      padding: 8px 12px;
      margin-bottom: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: none;
    }

    #screen {
      flex: 1;
      font-size: 1.1rem;
      line-height: 1.5;
      font-weight: 400;
      letter-spacing: 0.3px;
      color: #00ff41;
      text-shadow: 0 0 6px #00ff4166;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      width: 100%;
      height: 100%;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #00ff4133 #0f140f;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #screen::-webkit-scrollbar {
      width: 4px;
    }
    #screen::-webkit-scrollbar-track {
      background: #0f140f;
    }
    #screen::-webkit-scrollbar-thumb {
      background: #00ff4144;
      border-radius: 8px;
    }

    /* ----- KEYBOARD (bottom) - takes remaining space ----- */
    #keyboard {
      flex: 1 1 auto;
      min-height: 55%;
      background: #0f140f;
      border-radius: 12px 12px 18px 18px;
      border: 1px solid #1f3f1f;
      padding: 4px 4px 6px 4px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -2px 12px rgba(0, 255, 65, 0.08);
      touch-action: none;
      overflow: hidden;
    }

    /* top bar: symbols & specials */
    #symbol-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px 2px;
      padding: 3px 2px 5px 2px;
      border-bottom: 1px solid #1a3a1a;
      margin-bottom: 4px;
      background: #0c120c;
      border-radius: 8px 8px 0 0;
      min-height: 34px;
      align-items: center;
      touch-action: none;
      flex-shrink: 0;
    }

    .sym-btn {
      background: #162016;
      border: 1px solid #2a5a2a;
      color: #7fdb7f;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 0 4px #00ff4111;
      transition: all 0.08s ease;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.2px;
      touch-action: manipulation;
      min-width: 26px;
      text-align: center;
      line-height: 1.4;
      flex-shrink: 0;
    }

    .sym-btn:active {
      background: #2a4a2a;
      border-color: #6fcf6f;
      transform: scale(0.92);
      box-shadow: 0 0 12px #00ff4166;
    }

    /* main grid: alphabets + numbers + extras */
    #key-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px 3px;
      flex: 1;
      padding: 2px 2px;
      align-content: stretch;
      touch-action: none;
      min-height: 0;
    }

    .key-btn {
      background: #121a12;
      border: 1px solid #2a4a2a;
      color: #b3ffb3;
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.07s ease;
      box-shadow: 0 0 4px #00ff4111;
      touch-action: manipulation;
      padding: 1px 0;
      font-family: 'Courier New', monospace;
      min-height: 28px;
      line-height: 1.2;
    }

    .key-btn:active {
      background: #2a4a2a;
      border-color: #4fcf4f;
      transform: scale(0.94);
      box-shadow: 0 0 16px #00ff4177;
      color: #ffffff;
    }

    .key-btn.space {
      grid-column: span 2;
      background: #162016;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
      color: #7fbf7f;
    }

    .key-btn.backspace {
      background: #1a1f1a;
      color: #ff7f7f;
      border-color: #5a3a3a;
      font-size: 0.8rem;
    }

    .key-btn.clear {
      background: #1a1a1a;
      color: #ff9f5f;
      border-color: #5a4a2a;
      font-size: 0.7rem;
    }

    /* settings panel */
    #settings-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0f0adb;
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
      flex-direction: column;
      touch-action: none;
    }

    #settings-panel.active {
      display: flex;
    }

    #settings-box {
      background: #0f170f;
      border: 1px solid #2a5a2a;
      border-radius: 32px;
      padding: 24px 18px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 0 40px #00ff4122;
      touch-action: none;
    }

    #settings-box h2 {
      color: #00ff41;
      font-weight: 300;
      letter-spacing: 2px;
      font-size: 1.4rem;
      margin-bottom: 10px;
      text-align: center;
      text-shadow: 0 0 8px #00ff4155;
    }

    #code-input {
      width: 100%;
      height: 140px;
      background: #0a0f0a;
      border: 1px solid #2a5a2a;
      border-radius: 16px;
      color: #00ff41;
      font-size: 0.95rem;
      padding: 12px;
      font-family: 'Courier New', monospace;
      resize: vertical;
      outline: none;
      margin-bottom: 14px;
      touch-action: auto;
    }

    #code-input:focus {
      border-color: #5fcf5f;
      box-shadow: 0 0 16px #00ff4133;
    }

    .settings-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .settings-actions button {
      background: #1a2a1a;
      border: 1px solid #2a5a2a;
      color: #b3ffb3;
      padding: 10px 22px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.1s ease;
      font-family: 'Courier New', monospace;
      touch-action: manipulation;
    }

    .settings-actions button:active {
      background: #2a4a2a;
      transform: scale(0.95);
      box-shadow: 0 0 16px #00ff4166;
    }

    #load-status {
      color: #8fbf8f;
      margin-top: 4px;
      font-size: 0.85rem;
      text-align: center;
    }

    #gear {
      position: fixed;
      bottom: 8px;
      right: 12px;
      background: #0f170fcc;
      border: 1px solid #2a5a2a;
      border-radius: 40px;
      padding: 6px 10px;
      color: #5f9f5f;
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 50;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 8px #00ff4111;
      transition: 0.1s;
      touch-action: manipulation;
    }

    #gear:active {
      background: #2a4a2a;
      color: #afffaf;
    }

    /* responsive adjustments */
    @media (max-width: 480px) {
      .key-btn { font-size: 0.8rem; min-height: 24px; }
      .sym-btn { font-size: 0.6rem; padding: 1px 4px; min-width: 20px; }
      #screen { font-size: 0.95rem; }
      #settings-box { padding: 18px 14px; }
      #screen-container { height: 25%; min-height: 60px; }
    }

    @media (max-height: 600px) {
      #screen-container { height: 22%; min-height: 50px; }
      .key-btn { font-size: 0.7rem; min-height: 20px; }
      .sym-btn { font-size: 0.55rem; padding: 1px 3px; min-width: 18px; }
      #symbol-bar { min-height: 26px; gap: 2px; padding: 2px 2px 3px 2px; }
      #key-grid { gap: 2px; }
    }

    @media (max-height: 500px) {
      #screen-container { height: 18%; min-height: 40px; padding: 4px 8px; }
      #screen { font-size: 0.8rem; line-height: 1.3; }
      .key-btn { font-size: 0.6rem; min-height: 16px; border-radius: 6px; }
      .sym-btn { font-size: 0.5rem; padding: 0px 3px; min-width: 14px; }
      #key-grid { gap: 1px; }
    }

    ::selection {
      background: transparent;
    }
    ::-moz-selection {
      background: transparent;
    }
  </style>
</head>
<body>
<div id="app">
  <!-- SCREEN -->
  <div id="screen-container">
    <div id="screen" contenteditable="false" readonly></div>
  </div>

  <!-- KEYBOARD -->
  <div id="keyboard">
    <div id="symbol-bar"></div>
    <div id="key-grid"></div>
  </div>
</div>

<!-- Settings Panel -->
<div id="settings-panel">
  <div id="settings-box">
    <h2>⧩ PASTE CODE</h2>
    <textarea id="code-input" placeholder="Paste any code here...&#10;It will load into the terminal."></textarea>
    <div class="settings-actions">
      <button id="load-code-btn">⟳ LOAD</button>
      <button id="close-settings-btn">✕ CLOSE</button>
    </div>
    <div id="load-status">Ready</div>
  </div>
</div>

<div id="gear">⚙️</div>

<script>
  (function() {
    let fullCode = '';
    let currentIndex = 0;
    let displayString = '';

    const screenEl = document.getElementById('screen');
    const symbolBar = document.getElementById('symbol-bar');
    const keyGrid = document.getElementById('key-grid');
    const settingsPanel = document.getElementById('settings-panel');
    const codeInput = document.getElementById('code-input');
    const loadStatus = document.getElementById('load-status');
    const gearBtn = document.getElementById('gear');

    const DEFAULT_SYMBOLS = [
      '{', '}', '(', ')', '[', ']', '<', '>', '=', '!', '?',
      '&', '|', '^', '~', '#', '@', '$', '%', '*', '+', '-',
      '_', '/', '\\', ';', ':', ',', '.', '`', '"', "'"
    ];

    const KEY_ROWS = [
      ['1','2','3','4','5','6','7','8','9','0','-','='],
      ['q','w','e','r','t','y','u','i','o','p','[',']'],
      ['a','s','d','f','g','h','j','k','l',';','\'','\\'],
      ['z','x','c','v','b','n','m',',','.','/','`'],
    ];

    function updateScreen() {
      displayString = fullCode.substring(0, currentIndex);
      screenEl.textContent = displayString;
      screenEl.scrollTop = screenEl.scrollHeight;
    }

    function typeNextChar() {
      if (currentIndex < fullCode.length) {
        currentIndex++;
        updateScreen();
      }
    }

    function resetTyping() {
      currentIndex = 0;
      updateScreen();
    }
    function clearScreen() { resetTyping(); }

    function backspace() {
      if (currentIndex > 0) {
        currentIndex--;
        updateScreen();
      }
    }

    function loadCodeFromSettings() {
      const raw = codeInput.value;
      fullCode = raw;
      currentIndex = 0;
      updateScreen();
      loadStatus.textContent = `✅ Loaded ${raw.length} characters. Ready to type.`;
      settingsPanel.classList.remove('active');
    }

    function buildSymbolBar(symbolsArray) {
      symbolBar.innerHTML = '';
      symbolsArray.forEach(sym => {
        const btn = document.createElement('button');
        btn.className = 'sym-btn';
        btn.textContent = sym;
        btn.dataset.char = sym;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          typeNextChar();
        });
        btn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          typeNextChar();
        }, { passive: false });
        symbolBar.appendChild(btn);
      });
    }

    function buildKeyGrid() {
      keyGrid.innerHTML = '';

      const allKeys = KEY_ROWS.flat();
      allKeys.forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'key-btn';
        btn.textContent = key;
        btn.dataset.char = key;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          typeNextChar();
        });
        btn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          typeNextChar();
        }, { passive: false });
        keyGrid.appendChild(btn);
      });

      const spaceBtn = document.createElement('button');
      spaceBtn.className = 'key-btn space';
      spaceBtn.textContent = '␣ SPACE';
      spaceBtn.addEventListener('click', () => typeNextChar());
      spaceBtn.addEventListener('touchstart', (e) => { e.preventDefault(); typeNextChar(); }, { passive: false });
      keyGrid.appendChild(spaceBtn);

      const backBtn = document.createElement('button');
      backBtn.className = 'key-btn backspace';
      backBtn.textContent = '⌫';
      backBtn.addEventListener('click', backspace);
      backBtn.addEventListener('touchstart', (e) => { e.preventDefault(); backspace(); }, { passive: false });
      keyGrid.appendChild(backBtn);

      const clearBtn = document.createElement('button');
      clearBtn.className = 'key-btn clear';
      clearBtn.textContent = '✕ CLR';
      clearBtn.addEventListener('click', clearScreen);
      clearBtn.addEventListener('touchstart', (e) => { e.preventDefault(); clearScreen(); }, { passive: false });
      keyGrid.appendChild(clearBtn);
    }

    function openSettings() {
      settingsPanel.classList.add('active');
      codeInput.value = fullCode;
      loadStatus.textContent = 'Paste code and press LOAD.';
      codeInput.focus();
    }

    function closeSettings() {
      settingsPanel.classList.remove('active');
    }

    function init() {
      buildSymbolBar(DEFAULT_SYMBOLS);
      buildKeyGrid();

      const demoCode = `<!DOCTYPE html>
<html>
<head>
  <title>Matrix Terminal</title>
</head>
<body>
  <h1>Hello, World!</h1>
</body>
</html>`;
      fullCode = demoCode;
      currentIndex = 0;
      updateScreen();

      gearBtn.addEventListener('click', openSettings);
      document.getElementById('close-settings-btn').addEventListener('click', closeSettings);
      document.getElementById('load-code-btn').addEventListener('click', loadCodeFromSettings);

      settingsPanel.addEventListener('click', (e) => {
        if (e.target === settingsPanel) closeSettings();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && settingsPanel.classList.contains('active')) {
          closeSettings();
        }
      });

      codeInput.addEventListener('input', () => {
        loadStatus.textContent = `📝 ${codeInput.value.length} chars (press LOAD)`;
      });

      document.addEventListener('keydown', (e) => {
        if (settingsPanel.classList.contains('active')) return;
        if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
          e.preventDefault();
          typeNextChar();
        }
      });

      document.addEventListener('gesturestart', (e) => e.preventDefault());
      document.addEventListener('gesturechange', (e) => e.preventDefault());
      document.addEventListener('gestureend', (e) => e.preventDefault());
      document.addEventListener('touchmove', (e) => {
        if (e.target.closest('#code-input')) return;
        e.preventDefault();
      }, { passive: false });
    }

    init();
  })();
</script>
</body>
</html>
