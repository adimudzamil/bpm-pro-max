  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Courier New', Courier, 'Fira Code', monospace;
    }

    html, body {
      background: #0a0f0a;
      color: #00ff41;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: none;
      touch-action: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: #0a0f0a;
      padding: 6px 6px 4px 6px;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      touch-action: none;
    }

    /* ----- SCREEN (top) ----- */
    #screen-container {
      flex: 0 0 auto;
      height: 30%;
      min-height: 80px;
      max-height: 35%;
      background: #0f140f;
      border: 1px solid #1f3f1f;
      border-radius: 14px 14px 8px 8px;
      box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.08), 0 0 12px rgba(0, 255, 65, 0.15);
      padding: 8px 12px;
      margin-bottom: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: none;
      position: relative;
    }

    #screen {
      flex: 1;
      font-size: 1.1rem;
      line-height: 1.5;
      font-weight: 400;
      letter-spacing: 0.3px;
      color: #00ff41;
      text-shadow: 0 0 6px #00ff4166;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      width: 100%;
      height: 100%;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #00ff4133 #0f140f;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #screen::-webkit-scrollbar {
      width: 4px;
    }
    #screen::-webkit-scrollbar-track {
      background: #0f140f;
    }
    #screen::-webkit-scrollbar-thumb {
      background: #00ff4144;
      border-radius: 8px;
    }

    /* ----- KEYBOARD (bottom) ----- */
    #keyboard {
      flex: 1 1 auto;
      min-height: 55%;
      background: #0f140f;
      border-radius: 12px 12px 18px 18px;
      border: 1px solid #1f3f1f;
      padding: 4px 4px 6px 4px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -2px 12px rgba(0, 255, 65, 0.08);
      touch-action: none;
      overflow: hidden;
      position: relative;
    }

    /* Glide trail overlay */
    #glide-trail {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
      border-radius: 12px;
    }

    .glide-dot {
      position: absolute;
      width: 16px;
      height: 16px;
      background: radial-gradient(circle, #00ff41 0%, rgba(0, 255, 65, 0.3) 70%, transparent 100%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: fadeDot 0.6s ease-out forwards;
      box-shadow: 0 0 20px #00ff4166;
    }

    @keyframes fadeDot {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
    }

    /* top bar: symbols - all same size, jumbled */
    #symbol-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      padding: 4px 2px 6px 2px;
      border-bottom: 1px solid #1a3a1a;
      margin-bottom: 4px;
      background: #0c120c;
      border-radius: 8px 8px 0 0;
      min-height: 32px;
      align-items: center;
      touch-action: none;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .sym-btn {
      background: #162016;
      border: 1px solid #2a5a2a;
      color: #7fdb7f;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 0;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 0 4px #00ff4111;
      transition: all 0.08s ease;
      font-family: 'Courier New', monospace;
      touch-action: none;
      text-align: center;
      line-height: 1.4;
      flex-shrink: 0;
      width: 32px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .sym-btn:active {
      background: #2a4a2a;
      border-color: #6fcf6f;
      transform: scale(0.92);
      box-shadow: 0 0 12px #00ff4166;
    }

    /* main grid: all buttons exactly the same size, jumbled */
    #key-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      flex: 1;
      padding: 2px 2px;
      align-content: stretch;
      touch-action: none;
      min-height: 0;
      position: relative;
      z-index: 1;
    }

    .key-btn {
      background: #121a12;
      border: 1px solid #2a5a2a;
      color: #b3ffb3;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.07s ease;
      box-shadow: 0 0 4px #00ff4111;
      touch-action: none;
      padding: 0;
      font-family: 'Courier New', monospace;
      min-height: 28px;
      height: 100%;
      width: 100%;
      aspect-ratio: 1 / 1;
      line-height: 1.2;
      position: relative;
      z-index: 2;
    }

    .key-btn:active {
      background: #2a4a2a;
      border-color: #4fcf4f;
      transform: scale(0.94);
      box-shadow: 0 0 16px #00ff4177;
      color: #ffffff;
    }

    /* special buttons - same size, just different label */
    .key-btn.space {
      background: #162016;
      font-size: 0.65rem;
      letter-spacing: 0.3px;
      color: #7fbf7f;
    }

    .key-btn.backspace {
      background: #1a1f1a;
      color: #ff7f7f;
      border-color: #5a3a3a;
      font-size: 0.8rem;
    }

    .key-btn.clear {
      background: #1a1a1a;
      color: #ff9f5f;
      border-color: #5a4a2a;
      font-size: 0.7rem;
    }

    /* settings panel */
    #settings-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0f0adb;
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
      flex-direction: column;
      touch-action: none;
    }

    #settings-panel.active {
      display: flex;
    }

    #settings-box {
      background: #0f170f;
      border: 1px solid #2a5a2a;
      border-radius: 32px;
      padding: 24px 18px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 0 40px #00ff4122;
      touch-action: none;
    }

    #settings-box h2 {
      color: #00ff41;
      font-weight: 300;
      letter-spacing: 2px;
      font-size: 1.4rem;
      margin-bottom: 10px;
      text-align: center;
      text-shadow: 0 0 8px #00ff4155;
    }

    #code-input {
      width: 100%;
      height: 140px;
      background: #0a0f0a;
      border: 1px solid #2a5a2a;
      border-radius: 16px;
      color: #00ff41;
      font-size: 0.95rem;
      padding: 12px;
      font-family: 'Courier New', monospace;
      resize: vertical;
      outline: none;
      margin-bottom: 14px;
      touch-action: auto;
    }

    #code-input:focus {
      border-color: #5fcf5f;
      box-shadow: 0 0 16px #00ff4133;
    }

    .settings-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .settings-actions button {
      background: #1a2a1a;
      border: 1px solid #2a5a2a;
      color: #b3ffb3;
      padding: 10px 22px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.1s ease;
      font-family: 'Courier New', monospace;
      touch-action: manipulation;
    }

    .settings-actions button:active {
      background: #2a4a2a;
      transform: scale(0.95);
      box-shadow: 0 0 16px #00ff4166;
    }

    #load-status {
      color: #8fbf8f;
      margin-top: 4px;
      font-size: 0.85rem;
      text-align: center;
    }

    #gear {
      position: fixed;
      bottom: 8px;
      right: 12px;
      background: #0f170fcc;
      border: 1px solid #2a5a2a;
      border-radius: 40px;
      padding: 6px 10px;
      color: #5f9f5f;
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 50;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 8px #00ff4111;
      transition: 0.1s;
      touch-action: manipulation;
    }

    #gear:active {
      background: #2a4a2a;
      color: #afffaf;
    }

    /* responsive */
    @media (max-width: 480px) {
      .key-btn { font-size: 0.75rem; min-height: 24px; }
      .sym-btn { font-size: 0.6rem; width: 26px; height: 24px; }
      #screen { font-size: 0.95rem; }
      #settings-box { padding: 18px 14px; }

    @media (max-height: 600px) {

      .sym-btn { font-size: 0.55rem; width: 22px; height: 20px; }
      #symbol-bar { min-height: 24px; gap: 3px; padding: 2px 2px 4px 2px; }
      #key-grid { gap: 3px; }

    @media (max-height: 500px) {

      #screen { font-size: 0.8rem; line-height: 1.3; }

    ::selection {
      background: transparent;
    }
    ::-moz-selection {
      background: transparent;

<body>
<div id="app">
  <!-- SCREEN -->
  <div id="screen-container">
    <div id="screen" contenteditable="false" readonly></div>
  </div>

  <!-- KEYBOARD -->
  <div id="keyboard">
    <div id="glide-trail"></div>
    <div id="symbol-bar"></div>
    <div id="key-grid"></div>
  </div>
</div>

<!-- Settings Panel -->
<div id="settings-panel">
  <div id="settings-box">
    <h2>⧩ PASTE CODE</h2>
    <textarea id="code-input" placeholder="Paste any code here...&#10;It will load into the terminal."></textarea>
    <div class="settings-actions">
      <button id="load-code-btn">⟳ LOAD</button>
      <button id="close-settings-btn">✕ CLOSE</button>
    </div>
    <div id="load-status">Ready</div>
  </div>
</div>

<div id="gear">⚙️</div>

<script>
  (function() {
    let fullCode = '';
    let currentIndex = 0;
    let displayString = '';

    const screenEl = document.getElementById('screen');
    const symbolBar = document.getElementById('symbol-bar');
    const keyGrid = document.getElementById('key-grid');
    const settingsPanel = document.getElementById('settings-panel');
    const codeInput = document.getElementById('code-input');
    const loadStatus = document.getElementById('load-status');
    const gearBtn = document.getElementById('gear');
    const glideTrail = document.getElementById('glide-trail');

    // All symbols - jumbled order
    const SYMBOLS = [
      '~', '!', '@', '#', '$', '%', '^', '&', '*', '(', ')',
      '-', '_', '=', '+', '[', ']', '{', '}', '\\', '|', ';',
      ':', '"', "'", '<', '>', ',', '.', '/', '?', '`'
    ];

    // All characters - jumbled (alphabets, numbers, symbols mixed)
    const ALL_CHARS = [
      '7', 'w', 'f', '2', 'k', 'z', '9', 'p', 'm', 'q', 'x', 'd',
      '4', 'r', 'h', 'j', '3', 'y', 'u', 'c', 'v', 'b', 'n', '8',
      'e', 't', 'i', 'o', 'a', 's', 'g', 'l', '6', '0', '1', '5',
      '=', '-', '_', '+', '[', ']', '{', '}', '\\', '|', ';', ':',
      '"', "'", '<', '>', ',', '.', '/', '?', '`', '~', '!', '@',
      '#', '$', '%', '^', '&', '*', '(', ')'
    ];

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Jumble the arrays
    const jumbledSymbols = shuffleArray([...SYMBOLS]);
    const jumbledChars = shuffleArray([...ALL_CHARS]);

    // Glide typing state
    let isGliding = false;
    let lastGlideX = 0;
    let lastGlideY = 0;
    let glideTimeout = null;

    function updateScreen() {
      displayString = fullCode.substring(0, currentIndex);
      screenEl.textContent = displayString;
      screenEl.scrollTop = screenEl.scrollHeight;
    }

    function typeNextChar() {
      if (currentIndex < fullCode.length) {
        currentIndex++;
        updateScreen();
      }
    }

    function resetTyping() {
      currentIndex = 0;
      updateScreen();
    }
    function clearScreen() { resetTyping(); }

    function backspace() {
      if (currentIndex > 0) {
        currentIndex--;
        updateScreen();
      }
    }

    function loadCodeFromSettings() {
      const raw = codeInput.value;
      fullCode = raw;
      currentIndex = 0;
      updateScreen();
      loadStatus.textContent = `✅ Loaded ${raw.length} characters. Ready to type.`;
      settingsPanel.classList.remove('active');
    }

    // Glide trail effects
    function createGlideDot(x, y) {
      const dot = document.createElement('div');
      dot.className = 'glide-dot';
      dot.style.left = x + 'px';
      dot.style.top = y + 'px';
      glideTrail.appendChild(dot);
      setTimeout(() => {
        if (dot.parentNode) dot.remove();
      }, 700);
    }

    function getRelativePos(e, element) {
      const rect = element.getBoundingClientRect();
      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // Handle glide start
    function startGlide(e) {
      isGliding = true;
      const pos = getRelativePos(e, glideTrail);
      lastGlideX = pos.x;
      lastGlideY = pos.y;
      createGlideDot(pos.x, pos.y);
    }

    // Handle glide move
    function moveGlide(e) {
      if (!isGliding) return;
      e.preventDefault();
      const pos = getRelativePos(e, glideTrail);
      // Add dot if moved enough
      const dx = pos.x - lastGlideX;
      const dy = pos.y - lastGlideY;
      if (Math.sqrt(dx*dx + dy*dy) > 8) {
        createGlideDot(pos.x, pos.y);
        lastGlideX = pos.x;
        lastGlideY = pos.y;
      }
    }

    // Handle glide end
    function endGlide(e) {
      if (isGliding) {
        isGliding = false;
        // Add one final dot
        const pos = getRelativePos(e, glideTrail);
        createGlideDot(pos.x, pos.y);
        // Type the character from the last touched button
        const target = e.target.closest ? e.target.closest('.key-btn, .sym-btn') : null;
        if (target && target.dataset && target.dataset.char !== undefined) {
          typeNextChar();
        }
      }
    }

    // Setup glide events on keyboard
    const keyboard = document.getElementById('keyboard');

    // Touch events for glide
    keyboard.addEventListener('touchstart', (e) => {
      // Check if touch started on a button
      const btn = e.target.closest('.key-btn, .sym-btn');
      if (btn) {
        startGlide(e);
        // Also trigger immediate type on tap (non-glide)
        // But we'll let glide handle it on end
      }
    }, { passive: true });

    keyboard.addEventListener('touchmove', (e) => {
      if (isGliding) {
        moveGlide(e);
      }
    }, { passive: false });

    keyboard.addEventListener('touchend', (e) => {
      if (isGliding) {
        // Get the button that was touched
        const touch = e.changedTouches[0];
        const element = document.elementFromPoint(touch.clientX, touch.clientY);
        const btn = element ? element.closest('.key-btn, .sym-btn') : null;
        if (btn) {
          // Add final dot at touch end position
          const rect = glideTrail.getBoundingClientRect();
          createGlideDot(touch.clientX - rect.left, touch.clientY - rect.top);
          // Type the character
          typeNextChar();
        }
        isGliding = false;
      }
    }, { passive: true });

    // Mouse events for desktop glide simulation
    let mouseDown = false;
    keyboard.addEventListener('mousedown', (e) => {
      const btn = e.target.closest('.key-btn, .sym-btn');
      if (btn) {
        mouseDown = true;
        startGlide(e);
      }
    });

    keyboard.addEventListener('mousemove', (e) => {
      if (mouseDown) {
        moveGlide(e);
      }
    });

    keyboard.addEventListener('mouseup', (e) => {
      if (mouseDown) {
        mouseDown = false;
        const btn = e.target.closest('.key-btn, .sym-btn');
        if (btn) {
          const rect = glideTrail.getBoundingClientRect();
          createGlideDot(e.clientX - rect.left, e.clientY - rect.top);
          typeNextChar();
        }
        isGliding = false;
      }
    });

    keyboard.addEventListener('mouseleave', () => {
      if (mouseDown) {
        mouseDown = false;
        isGliding = false;
      }
    });

    // Also support regular click as fallback
    function handleButtonClick(e) {
      const btn = e.target.closest('.key-btn, .sym-btn');
      if (btn && !e.touches) {
        // For mouse click without drag
        const rect = glideTrail.getBoundingClientRect();
        createGlideDot(e.clientX - rect.left, e.clientY - rect.top);
        typeNextChar();
      }
    }

    // Build symbol bar
    function buildSymbolBar() {
      symbolBar.innerHTML = '';
      jumbledSymbols.forEach(sym => {
        const btn = document.createElement('button');
        btn.className = 'sym-btn';
        btn.textContent = sym;
        btn.dataset.char = sym;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          // For click fallback
          const rect = glideTrail.getBoundingClientRect();
          createGlideDot(e.clientX - rect.left, e.clientY - rect.top);
          typeNextChar();
        });
        symbolBar.appendChild(btn);
      });
    }

    // Build key grid
    function buildKeyGrid() {
      keyGrid.innerHTML = '';

      jumbledChars.forEach(char => {
        const btn = document.createElement('button');
        btn.className = 'key-btn';
        btn.textContent = char;
        btn.dataset.char = char;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const rect = glideTrail.getBoundingClientRect();
          createGlideDot(e.clientX - rect.left, e.clientY - rect.top);
          typeNextChar();
        });
        keyGrid.appendChild(btn);
      });

      // SPACE
      const spaceBtn = document.createElement('button');
      spaceBtn.className = 'key-btn space';
      spaceBtn.textContent = '␣';
      spaceBtn.dataset.char = ' ';
      spaceBtn.addEventListener('click', () => {
        typeNextChar();
      });
      keyGrid.appendChild(spaceBtn);

      // BACKSPACE
      const backBtn = document.createElement('button');
      backBtn.className = 'key-btn backspace';
      backBtn.textContent = '⌫';
      backBtn.dataset.char = '⌫';
      backBtn.addEventListener('click', () => {
        backspace();
      });
      keyGrid.appendChild(backBtn);

      // CLEAR
      const clearBtn = document.createElement('button');
      clearBtn.className = 'key-btn clear';
      clearBtn.textContent = '✕';
      clearBtn.dataset.char = '✕';
      clearBtn.addEventListener('click', () => {
        clearScreen();
      });
      keyGrid.appendChild(clearBtn);
    }

    function openSettings() {
      settingsPanel.classList.add('active');
      codeInput.value = fullCode;
      loadStatus.textContent = 'Paste code and press LOAD.';
      codeInput.focus();
    }

    function closeSettings() {
      settingsPanel.classList.remove('active');
    }

    function init() {
      buildSymbolBar();
      buildKeyGrid();

      const demoCode = `<!DOCTYPE html>
<html>
<head>
  <title>Matrix Terminal</title>
</head>
<body>
  <h1>Hello, World!</h1>
</body>
</html>`;
      fullCode = demoCode;
      currentIndex = 0;
      updateScreen();

      gearBtn.addEventListener('click', openSettings);
      document.getElementById('close-settings-btn').addEventListener('click', closeSettings);
      document.getElementById('load-code-btn').addEventListener('click', loadCodeFromSettings);

      settingsPanel.addEventListener('click', (e) => {
        if (e.target === settingsPanel) closeSettings();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && settingsPanel.classList.contains('active')) {
          closeSettings();
        }
      });

      codeInput.addEventListener('input', () => {
        loadStatus.textContent = `📝 ${codeInput.value.length} chars (press LOAD)`;
      });

      document.addEventListener('keydown', (e) => {
        if (settingsPanel.classList.contains('active')) return;
        if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
          e.preventDefault();
          typeNextChar();
        }
      });

      document.addEventListener('gesturestart', (e) => e.preventDefault());
      document.addEventListener('gesturechange', (e) => e.preventDefault());
      document.addEventListener('gestureend', (e) => e.preventDefault());
      document.addEventListener('touchmove', (e) => {
        if (e.target.closest('#code-input')) return;
        e.preventDefault();
      }, { passive: false });
    }

    init();
  })();
</script>
</body>
</html>
