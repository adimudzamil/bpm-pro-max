<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0f0a">
  <title>⌨️ MATRIX TERMINAL</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Courier New', Courier, 'Fira Code', monospace;
    }

    body {
      background: #0a0f0a;
      color: #00ff41;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: #0a0f0a;
      padding: 8px 6px 6px 6px;
    }

    /* ----- SCREEN (top half) ----- */
    #screen-container {
      flex: 1 1 50%;
      min-height: 40%;
      background: #0f140f;
      border: 1px solid #1f3f1f;
      border-radius: 16px 16px 8px 8px;
      box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.08), 0 0 12px rgba(0, 255, 65, 0.15);
      padding: 12px 14px;
      margin-bottom: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #screen {
      flex: 1;
      font-size: 1.3rem;
      line-height: 1.6;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: #00ff41;
      text-shadow: 0 0 6px #00ff4166;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      width: 100%;
      height: 100%;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #00ff4133 #0f140f;
    }

    #screen::-webkit-scrollbar {
      width: 5px;
    }
    #screen::-webkit-scrollbar-track {
      background: #0f140f;
    }
    #screen::-webkit-scrollbar-thumb {
      background: #00ff4144;
      border-radius: 8px;
    }

    /* ----- KEYBOARD (bottom half) ----- */
    #keyboard {
      flex: 1 1 50%;
      min-height: 45%;
      background: #0f140f;
      border-radius: 12px 12px 18px 18px;
      border: 1px solid #1f3f1f;
      padding: 6px 4px 10px 4px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -2px 12px rgba(0, 255, 65, 0.08);
    }

    /* top bar: symbols & specials */
    #symbol-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px 3px;
      padding: 6px 4px 8px 4px;
      border-bottom: 1px solid #1a3a1a;
      margin-bottom: 6px;
      background: #0c120c;
      border-radius: 10px 10px 0 0;
      min-height: 48px;
      align-items: center;
    }

    .sym-btn {
      background: #162016;
      border: 1px solid #2a5a2a;
      color: #7fdb7f;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 0 4px #00ff4111;
      transition: all 0.08s ease;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.3px;
      touch-action: manipulation;
      min-width: 32px;
      text-align: center;
    }

    .sym-btn:active {
      background: #2a4a2a;
      border-color: #6fcf6f;
      transform: scale(0.92);
      box-shadow: 0 0 12px #00ff4166;
    }

    /* main grid: alphabets + numbers + extras */
    #key-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px 4px;
      flex: 1;
      padding: 4px 2px;
      align-content: stretch;
    }

    .key-btn {
      background: #121a12;
      border: 1px solid #2a4a2a;
      color: #b3ffb3;
      font-size: 1.2rem;
      font-weight: 500;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.07s ease;
      box-shadow: 0 0 4px #00ff4111;
      touch-action: manipulation;
      padding: 2px 0;
      font-family: 'Courier New', monospace;
      min-height: 40px;
    }

    .key-btn:active {
      background: #2a4a2a;
      border-color: #4fcf4f;
      transform: scale(0.94);
      box-shadow: 0 0 16px #00ff4177;
      color: #ffffff;
    }

    .key-btn.space {
      grid-column: span 2;
      background: #162016;
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: #7fbf7f;
    }

    .key-btn.backspace {
      background: #1a1f1a;
      color: #ff7f7f;
      border-color: #5a3a3a;
      font-size: 0.9rem;
    }

    .key-btn.clear {
      background: #1a1a1a;
      color: #ff9f5f;
      border-color: #5a4a2a;
      font-size: 0.8rem;
    }

    /* settings panel (hidden by default) */
    #settings-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0f0adb;
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
      flex-direction: column;
    }

    #settings-panel.active {
      display: flex;
    }

    #settings-box {
      background: #0f170f;
      border: 1px solid #2a5a2a;
      border-radius: 32px;
      padding: 28px 22px;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 0 40px #00ff4122;
    }

    #settings-box h2 {
      color: #00ff41;
      font-weight: 300;
      letter-spacing: 2px;
      font-size: 1.6rem;
      margin-bottom: 12px;
      text-align: center;
      text-shadow: 0 0 8px #00ff4155;
    }

    #code-input {
      width: 100%;
      height: 160px;
      background: #0a0f0a;
      border: 1px solid #2a5a2a;
      border-radius: 16px;
      color: #00ff41;
      font-size: 1rem;
      padding: 14px;
      font-family: 'Courier New', monospace;
      resize: vertical;
      outline: none;
      margin-bottom: 18px;
    }

    #code-input:focus {
      border-color: #5fcf5f;
      box-shadow: 0 0 16px #00ff4133;
    }

    .settings-actions {
      display: flex;
      gap: 14px;
      justify-content: flex-end;
    }

    .settings-actions button {
      background: #1a2a1a;
      border: 1px solid #2a5a2a;
      color: #b3ffb3;
      padding: 12px 26px;
      border-radius: 40px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.1s ease;
      font-family: 'Courier New', monospace;
    }

    .settings-actions button:active {
      background: #2a4a2a;
      transform: scale(0.95);
      box-shadow: 0 0 16px #00ff4166;
    }

    #load-status {
      color: #8fbf8f;
      margin-top: 6px;
      font-size: 0.9rem;
      text-align: center;
    }

    /* gear */
    #gear {
      position: fixed;
      bottom: 12px;
      right: 16px;
      background: #0f170fcc;
      border: 1px solid #2a5a2a;
      border-radius: 40px;
      padding: 8px 12px;
      color: #5f9f5f;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 50;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 8px #00ff4111;
      transition: 0.1s;
      touch-action: manipulation;
    }

    #gear:active {
      background: #2a4a2a;
      color: #afffaf;
    }

    @media (max-width: 480px) {
      .key-btn { font-size: 1rem; min-height: 36px; }
      .sym-btn { font-size: 0.75rem; padding: 3px 6px; }
      #screen { font-size: 1rem; }
      #settings-box { padding: 20px 14px; }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- SCREEN -->
  <div id="screen-container">
    <div id="screen" contenteditable="false" readonly></div>
  </div>

  <!-- KEYBOARD -->
  <div id="keyboard">
    <!-- symbol bar -->
    <div id="symbol-bar"></div>
    <!-- grid -->
    <div id="key-grid"></div>
  </div>
</div>

<!-- Settings Panel -->
<div id="settings-panel">
  <div id="settings-box">
    <h2>⧩ PASTE CODE</h2>
    <textarea id="code-input" placeholder="Paste any code here...&#10;It will load into the terminal."></textarea>
    <div class="settings-actions">
      <button id="load-code-btn">⟳ LOAD</button>
      <button id="close-settings-btn">✕ CLOSE</button>
    </div>
    <div id="load-status">Ready</div>
  </div>
</div>

<!-- gear -->
<div id="gear">⚙️</div>

<script>
  (function() {
    // ---- state ----
    let fullCode = '';            // the full pasted code
    let currentIndex = 0;         // how many characters have been revealed
    let displayString = '';       // current visible string (cached)

    // DOM refs
    const screenEl = document.getElementById('screen');
    const symbolBar = document.getElementById('symbol-bar');
    const keyGrid = document.getElementById('key-grid');
    const settingsPanel = document.getElementById('settings-panel');
    const codeInput = document.getElementById('code-input');
    const loadStatus = document.getElementById('load-status');
    const gearBtn = document.getElementById('gear');

    // ---- default symbols (top bar) ----
    const DEFAULT_SYMBOLS = [
      '{', '}', '(', ')', '[', ']', '<', '>', '=', '!', '?',
      '&', '|', '^', '~', '#', '@', '$', '%', '*', '+', '-',
      '_', '/', '\\', ';', ':', ',', '.', '`', '"', "'"
    ];

    // ---- keyboard layout ----
    const KEY_ROWS = [
      ['1','2','3','4','5','6','7','8','9','0','-','='],
      ['q','w','e','r','t','y','u','i','o','p','[',']'],
      ['a','s','d','f','g','h','j','k','l',';','\'','\\'],
      ['z','x','c','v','b','n','m',',','.','/','`'],
    ];

    // ---- core: update screen from fullCode and currentIndex ----
    function updateScreen() {
      // reveal up to currentIndex characters
      displayString = fullCode.substring(0, currentIndex);
      screenEl.textContent = displayString;
      // auto-scroll to bottom
      screenEl.scrollTop = screenEl.scrollHeight;
    }

    // ---- type next character (any key press) ----
    function typeNextChar() {
      if (currentIndex < fullCode.length) {
        currentIndex++;
        updateScreen();
      } else {
        // optional: subtle feedback that we're at the end
        // just ignore or flash
      }
    }

    // ---- reset typing (clear screen, but keep fullCode) ----
    function resetTyping() {
      currentIndex = 0;
      updateScreen();
    }

    // ---- clear screen (reset index to 0) ----
    function clearScreen() {
      resetTyping();
    }

    // ---- backspace: remove last revealed character ----
    function backspace() {
      if (currentIndex > 0) {
        currentIndex--;
        updateScreen();
      }
    }

    // ---- load code from settings ----
    function loadCodeFromSettings() {
      const raw = codeInput.value;
      fullCode = raw;
      currentIndex = 0;           // start from blank
      updateScreen();
      loadStatus.textContent = `✅ Loaded ${raw.length} characters. Ready to type.`;
      settingsPanel.classList.remove('active');
    }

    // ---- build symbol bar ----
    function buildSymbolBar(symbolsArray) {
      symbolBar.innerHTML = '';
      symbolsArray.forEach(sym => {
        const btn = document.createElement('button');
        btn.className = 'sym-btn';
        btn.textContent = sym;
        btn.dataset.char = sym;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          typeNextChar();   // any button reveals next char
        });
        btn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          typeNextChar();
        }, { passive: false });
        symbolBar.appendChild(btn);
      });
    }

    // ---- build key grid ----
    function buildKeyGrid() {
      keyGrid.innerHTML = '';

      const allKeys = KEY_ROWS.flat();
      allKeys.forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'key-btn';
        btn.textContent = key;
        btn.dataset.char = key;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          typeNextChar();
        });
        btn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          typeNextChar();
        }, { passive: false });
        keyGrid.appendChild(btn);
      });

      // SPACE
      const spaceBtn = document.createElement('button');
      spaceBtn.className = 'key-btn space';
      spaceBtn.textContent = '␣ SPACE';
      spaceBtn.addEventListener('click', () => typeNextChar());
      spaceBtn.addEventListener('touchstart', (e) => { e.preventDefault(); typeNextChar(); }, { passive: false });
      keyGrid.appendChild(spaceBtn);

      // BACKSPACE
      const backBtn = document.createElement('button');
      backBtn.className = 'key-btn backspace';
      backBtn.textContent = '⌫';
      backBtn.addEventListener('click', backspace);
      backBtn.addEventListener('touchstart', (e) => { e.preventDefault(); backspace(); }, { passive: false });
      keyGrid.appendChild(backBtn);

      // CLEAR (reset)
      const clearBtn = document.createElement('button');
      clearBtn.className = 'key-btn clear';
      clearBtn.textContent = '✕ CLR';
      clearBtn.addEventListener('click', clearScreen);
      clearBtn.addEventListener('touchstart', (e) => { e.preventDefault(); clearScreen(); }, { passive: false });
      keyGrid.appendChild(clearBtn);
    }

    // ---- settings handlers ----
    function openSettings() {
      settingsPanel.classList.add('active');
      codeInput.value = fullCode;
      loadStatus.textContent = 'Paste code and press LOAD.';
      codeInput.focus();
    }

    function closeSettings() {
      settingsPanel.classList.remove('active');
    }

    // ---- init ----
    function init() {
      // Build UI
      buildSymbolBar(DEFAULT_SYMBOLS);
      buildKeyGrid();

      // Set initial code: a short demo (like HTML opening)
      const demoCode = `<!DOCTYPE html>
<html>
<head>
  <title>Matrix Terminal</title>
</head>
<body>
  <h1>Hello, World!</h1>
</body>
</html>`;
      fullCode = demoCode;
      currentIndex = 0;   // start blank
      updateScreen();

      // Event listeners
      gearBtn.addEventListener('click', openSettings);
      document.getElementById('close-settings-btn').addEventListener('click', closeSettings);
      document.getElementById('load-code-btn').addEventListener('click', loadCodeFromSettings);

      settingsPanel.addEventListener('click', (e) => {
        if (e.target === settingsPanel) closeSettings();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && settingsPanel.classList.contains('active')) {
          closeSettings();
        }
      });

      codeInput.addEventListener('input', () => {
        loadStatus.textContent = `📝 ${codeInput.value.length} chars (press LOAD)`;
      });

      // for demo: if user types any key, reveal next char (but we already handle via buttons)
      // additionally, we can also support keyboard input for desktop testing
      document.addEventListener('keydown', (e) => {
        // ignore if settings is open or if it's a control key
        if (settingsPanel.classList.contains('active')) return;
        // ignore if the key is a modifier or special (we only want printable chars)
        if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
          // but we don't actually use the key value, we just reveal next char
          // This makes any keypress on the keyboard advance the code.
          e.preventDefault();
          typeNextChar();
        }
      });
    }

    init();
  })();
</script>
</body>
